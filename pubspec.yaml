name: alacena
description: "Gestión de inventario doméstico (alacena) con base de datos local SQLite."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Persistencia local
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.0

  # Paquetes solicitados en la práctica
  table_calendar: ^3.1.3
  badges: ^3.1.2

  # Alarmas locales
  flutter_local_notifications: ^19.0.0
  timezone: any

  # Imágenes, estado y formato
  image_picker: ^1.0.7
  provider: ^6.1.0
  intl: any
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
